name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy the documentation site
    runs-on: ubuntu-latest
    # gh-deploy pushes the built site to gh-pages with the checkout's token,
    # so this job alone writes and keeps the credential.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r docs/requirements.txt
      # mkdocstrings reads the installed package, so the API reference needs it.
      - run: pip install -e .
      - run: mkdocs gh-deploy --force
