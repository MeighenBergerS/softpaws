name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-deploy pushes the built site to the gh-pages branch, which needs write access.
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r docs/requirements.txt
      # mkdocstrings reads the installed package, so the API reference needs it.
      - run: pip install -e .
      - run: mkdocs gh-deploy --force
