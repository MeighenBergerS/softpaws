name: Bug report
description: Something errors, crashes or behaves wrongly.
labels: [bug, needs triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      description: The shortest code that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full traceback, if there is one.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: softpaws, Python and operating system.
      placeholder: softpaws 0.1.0, Python 3.12, Ubuntu 24.04
    validations:
      required: true
