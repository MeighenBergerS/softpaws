name: Feature request
description: Something softpaws should do but doesn't.
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The analysis or task, and where softpaws gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The function, option or behaviour you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
