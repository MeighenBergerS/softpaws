name: Documentation
description: Something in the docs, a docstring or an example is unclear or wrong.
labels: [documentation, needs triage]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: A page, function or example.
      placeholder: docs/quickstart.md, step 5
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or wrong?
    validations:
      required: true
