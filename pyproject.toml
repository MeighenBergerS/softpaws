[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "softpaws"
version = "0.1.0"
description = "Soft-volume forward model for UHE neutrino telescopes, benchmarked against IceCube IRFs and data."
authors = [
    { name = "Stephan Meighen-Berger", email = "stephan.meighenberger@gmail.com" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "astropy>=6.0",
    "requests>=2.31",
    "emcee>=3.1",
    "corner>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pre-commit>=3",
]
# Atmospheric-neutrino background, used by examples/22 to tabulate the flux.
atm = [
    "MCEq>=1.4",
    "crflux>=2.0",
]
# Muon transport coefficients. Only needed to regenerate the shipped table with
# softpaws.transport.coefficients.build_proposal_table.
transport = [
    "proposal>=7.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that require network access (deselect with '-m not network')",
    "slow: slow tests, e.g. Monte-Carlo cross-checks (deselect with '-m not slow')",
]
