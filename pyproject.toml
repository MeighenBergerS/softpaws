[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "softpaws"
version = "0.1.0"
description = "Analytic muon-transport forward model for UHE neutrino telescopes: effective areas, event rates and event energies from first principles."
authors = [
    { name = "Stephan Meighen-Berger", email = "stephan.meighenberger@gmail.com" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "neutrino",
    "neutrino telescope",
    "muon transport",
    "effective area",
    "IceCube",
    "KM3NeT",
    "astroparticle physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "emcee>=3.1",
]

[project.urls]
Homepage = "https://github.com/MeighenBergerS/softpaws"
Documentation = "https://meighenbergers.github.io/softpaws/"
Repository = "https://github.com/MeighenBergerS/softpaws"
Issues = "https://github.com/MeighenBergerS/softpaws/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pre-commit>=3",
    "build>=1.0",
    "twine>=5.0",
]
# The documentation site; see docs/requirements.txt for the pinned build.
docs = [
    "mkdocs>=1.6",
    "mkdocs-api-autonav>=0.4",
    "mkdocstrings[python]>=0.25",
]
# Atmospheric-neutrino background, used by examples/22 to tabulate the flux.
atm = [
    "MCEq>=1.4",
    "crflux>=2.0",
]
# Muon transport coefficients. Only needed to regenerate the shipped table with
# softpaws.transport.coefficients.build_proposal_table.
transport = [
    "proposal>=7.6",
]
# The paper scripts in scripts/: corner plots, the arbitrary-precision moment
# check of script 37, and the PDF contour extraction in scripts/tools.
paper = [
    "corner>=2.2",
    "mpmath>=1.3",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The tabulated inputs the library reads at run time. The DR2 and HESE
# releases are not package data; see the documentation for where they go.
softpaws = [
    "py.typed",
    "data/atmospheric/*.npz",
    "data/bounds/*.csv",
    "data/coefficients/*.csv",
    "data/geofiles/*.geo",
    "data/icecube/*.csv",
    "data/km3net/*.csv",
    "data/km3net/uhe_release/**/*.json",
    "data/km3net/uhe_release/**/*.md",
    "data/pone/*.csv",
    "data/trident/*.csv",
    "data/xsec/**/*.csv",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
# A summary may be a noun phrase ("Effective area for ... [cm^2]."), see design rule D1.
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"tests/*.py" = ["E402"]
# Docstring rules (design rule D5) apply to the package only.
"!src/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that require network access (deselect with '-m not network')",
    "slow: slow tests, e.g. Monte-Carlo cross-checks (deselect with '-m not slow')",
]
